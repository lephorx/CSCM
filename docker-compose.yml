services:
  cscm:
    build: .
    container_name: cscm_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      # Mount Crafty's servers directory so file endpoints work
      - /var/opt/minecraft/crafty/crafty-4/servers:/crafty/servers:ro
    environment:
      - CRAFTY_SERVERS_DIR=/crafty/servers
    extra_hosts:
      # Allow the container to reach Crafty on the host machine
      - "host.docker.internal:host-gateway"
